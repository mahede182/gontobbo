services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gontobbo-app
    ports:
      - "8081:8081" # Metro bundler
      - "19000:19000" # Expo DevTools
      - "19001:19001" # Expo DevTools (secure)
      - "19002:19002" # Expo DevTools (ng serve)
    volumes:
      # Mount source code for live reload
      - ./src:/app/src
      - ./assets:/app/assets
      - ./App.tsx:/app/App.tsx
      - ./index.js:/app/index.js
      - ./app.config.ts:/app/app.config.ts
      - ./babel.config.js:/app/babel.config.js
      - ./metro.config.js:/app/metro.config.js
      - ./tsconfig.json:/app/tsconfig.json
      # Exclude node_modules from host (use container's version)
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - REACT_NATIVE_PACKAGER_HOSTNAME=0.0.0.0
    env_file:
      - .env
    stdin_open: true
    tty: true
    networks:
      - gontobbo-network

  # Development environment with staging configuration
  app-staging:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gontobbo-app-staging
    ports:
      - "8082:8081" # Metro bundler (different port to avoid conflicts)
      - "19003:19000" # Expo DevTools
      - "19004:19001" # Expo DevTools (secure)
      - "19005:19002" # Expo DevTools (ng serve)
    volumes:
      - ./src:/app/src
      - ./assets:/app/assets
      - ./App.tsx:/app/App.tsx
      - ./index.js:/app/index.js
      - ./app.config.ts:/app/app.config.ts
      - ./babel.config.js:/app/babel.config.js
      - ./metro.config.js:/app/metro.config.js
      - ./tsconfig.json:/app/tsconfig.json
      - /app/node_modules
    environment:
      - NODE_ENV=staging
      - REACT_NATIVE_PACKAGER_HOSTNAME=0.0.0.0
    env_file:
      - .env.staging
    stdin_open: true
    tty: true
    networks:
      - gontobbo-network
    profiles:
      - staging

networks:
  gontobbo-network:
    driver: bridge
